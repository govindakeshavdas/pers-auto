name: seed-jobs

on:
  schedule:
    # Every 2 days at 8am PT = 15:00 UTC (during PDT)
    - cron: "0 15 */2 * *"
  workflow_dispatch:

# Both workflows commit to the same repo, so serialise them rather than racing
# on the push. Queue the second run instead of cancelling it — its email has
# already been sent by the time it commits, so a cancel would lose the record.
concurrency:
  group: pers-auto-history-write
  cancel-in-progress: false

jobs:
  find-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Find seed-stage hiring + email via Resend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail

          body=$(./seed-jobs/run.sh)

          if [ -z "$body" ]; then
            echo "Empty response from run.sh" >&2
            exit 1
          fi

          printf '%s' "$body" | jq -Rs \
            --arg from "$MAIL_FROM" \
            --arg to "$MAIL_TO" \
            --arg subject "Seed-stage AI startups hiring founding engineers" \
            '{from:$from, to:[$to], subject:$subject, html:.}' \
          | curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              --fail-with-body

      # Raw API responses, so a bad run can be diagnosed after the fact.
      # run.sh discards all but the best draft; without this the discarded
      # ones are gone and there is nothing to debug against. Both phases are
      # kept — a thin final report is usually a discovery problem, not an
      # evaluate one, and only the discovery response shows that.
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-response
          path: |
            /tmp/discover_response.json
            /tmp/triage_response.json
            /tmp/evaluate_response.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed-jobs/history/
          git diff --cached --quiet && exit 0
          git commit -m "chore: save seed jobs results $(date +%Y-%m-%d)"
          # recent-seed-funding runs on the same schedule every 6 days and
          # pushes first — rebase or this push is rejected and the run is lost.
          # Both ledgers are merge=union (see .gitattributes) so two runs
          # appending names at EOF resolve instead of conflicting.
          git pull --rebase
          # union can duplicate a name both runs found; fold it back into the
          # commit so the stored ledger stays one-line-per-company.
          awk 'NF && !seen[tolower($0)]++' seed-jobs/history/ledger.txt > /tmp/ledger.dedup
          mv /tmp/ledger.dedup seed-jobs/history/ledger.txt
          git add seed-jobs/history/ledger.txt
          git diff --cached --quiet || git commit --amend --no-edit
          git push
